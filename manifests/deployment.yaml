apiVersion: apps/v1
kind: Deployment
metadata:
	name: nodejs-app-deployment
	labels:
		app: nodejs-app
spec:
	replicas: 3
	selector:
		matchLabels:
			app: nodejs-app
	template:
		metadata:
			labels:
				app: nodejs-app
		spec:
			containers:
				- name: nodejs-app
					image: docker.io/mahmoud58/nodejs-app:latest
          imagePullPolicy: Always
					ports:
						- containerPort: 3000
					resources:
						limits:
							cpu: "250m"
							memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
	name: nodejs-app-service
	labels:
		app: nodejs-app
spec:
	selector:
		app: nodejs-app
	ports:
		- protocol: TCP
			port: 80
			targetPort: 3000
	type: ClusterIP

